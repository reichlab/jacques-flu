[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jacques_flu"
version = "0.0.1"
description = "A application of Jacques method to COVID forecasting."
authors = [
  { name = "Benjamin W. Rogers" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12"

dependencies = [
    "pandas",
    "numpy",
    "tensorflow",
    "tensorflow-probability",
    "pytest",
    "tf-keras",
    "polars",
    "timeseriesutils @ git+https://github.com/reichlab/timeseriesutils",
    "jacques @ git+https://github.com/reichlab/jacques",
    'data-pipeline@git+https://github.com/reichlab/flusion.git#subdirectory=code/data-pipeline',
    "ipykernel",
    "typer",
    "pymmwr",
    "polars",
    "plotly",
    "pyarrow",
    "nbformat",
    "torch",
    "flake8",
    "ipython",
    "loguru",
    "matplotlib",
    "numpy",
    "pandas",
    "structlog",
    "python-dotenv>=1.0.1",
    "tqdm>=4.67.1",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["jacques_flu"]
force_sort_within_sections = true
